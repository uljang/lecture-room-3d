<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>대학 강의실 3D</title>
<script>
/* =====================================================================
   강의 내용 데이터 — 여기만 고치면 강의가 바뀝니다.
   (이전 12장 변형일치법 강의는 '강의데이터_백업_12장_변형일치법.js' 에 보관)
   ---------------------------------------------------------------------
   steps 의 각 단계:
     say   : 아바타가 하는 말 (화면 아래 자막으로 표시, '음성 켜기' 시 읽어 줌)
             → 긴 설명은 여기에 씁니다.
     board : 칠판에 띄울 내용. null 이면 칠판은 그대로 두고 말만 함
             → 칠판에는 핵심 키워드와 간단한 도식만 씁니다.
       title   : 칠판 제목
       points  : 핵심 내용 줄 목록. 글자 그대로 쓰임 ('• ' 같은 기호도 직접 씀)
                 강조할 줄은 { text: '...', color: 'red' | 'blue' | 'green', box: true } 처럼 객체로
       diagram : 오른쪽에 그릴 그림 (없으면 null → 글이 칠판 전체 폭을 씀)
                 'stiffness-compare' 단순보 vs 양단 고정보 처짐 비교
                 'table-analogy'     다리 3개 의자 vs 다리 4개 탁자
                 'statics-compare'   정정 보 vs 부정정 보 비교
                 'examples'          연속보, 양단 고정보
                 'propped-beam'      고정단 + 롤러 보 (등분포하중, 반력 표시)
                 'determinacy-scale' 불안정 / 정정 / 부정정 판별 눈금
                 'methods'           해법 분류 도식
                 'cantilever-udl'    캔틸레버 + 등분포하중, 처짐 δB1
                 'cantilever-point'  캔틸레버 + 끝단 R_B, 처짐 δB2
                 'superposition'     두 경우의 중첩
                 'bmd'               고정-롤러 보의 휨모멘트도
                 또는 함수 (g, x, y, w, h) => { ...캔버스 2D로 직접 그리기... }
   cover : 강의를 시작하기 전에 칠판에 적혀 있는 내용
   ===================================================================== */
window.LECTURE = {
  title: '부정정 구조물이란?',
  cover: {
    title: '오늘의 주제 :  부정정 구조물',
    points: [
      '① 왜 필요할까?',
      '② 쉬운 비유',
      '③ 정확한 정의',
      '④ 예시',
      '⑤ 자주 하는 실수',
      '⑥ 한 줄 요약',
    ],
    diagram: 'table-analogy',
  },
  steps: [
    // ① 왜 필요한가
    {
      say: '자, 오늘은 부정정 구조물이라는 개념을 처음부터 차근차근 알아보겠습니다. 다리나 건물 같은 실제 구조물을 보면, 기둥이나 지점이 꼭 필요한 개수보다 더 많이 들어가 있는 경우가 대부분이에요. 왜 그럴까요? 지점을 하나 더 두거나 끝을 단단히 고정하면 보가 훨씬 덜 처지고 휨모멘트도 줄어들어서, 같은 재료로 더 튼튼하게 만들 수 있거든요. 칠판 그림처럼 같은 하중이라도 양 끝을 고정하면 처짐이 단순보의 5분의 1밖에 안 됩니다. 게다가 한 곳이 손상돼도 다른 곳이 힘을 나눠 받아서 갑자기 무너지지 않아요. 문제는, 이렇게 받쳐 주는 곳이 많아지면 지금까지 배운 평형방정식만으로는 힘을 다 구할 수가 없다는 겁니다. 그래서 부정정 구조물이라는 개념이 필요해요.',
      board: {
        title: '① 왜 필요할까?',
        points: [
          '• 받침·고정을 더 두면',
          '    처짐 ↓   휨모멘트 ↓',
          '• 한 곳이 손상돼도 버팀',
          { text: '→ 그런데 평형식만으로는 못 푼다!', color: 'red' },
        ],
        diagram: 'stiffness-compare',
      },
    },
    // ② 쉬운 비유
    {
      say: '쉽게 비유해 볼게요. 다리가 세 개인 의자는 바닥이 조금 울퉁불퉁해도 세 다리가 항상 바닥에 닿습니다. 그래서 앉은 사람의 무게를 각 다리가 얼마씩 받는지는 힘의 평형만 따져도 딱 정해져요. 그런데 다리가 네 개인 식당 탁자는 어떤가요? 가끔 덜컹거리죠. 다리 길이가 조금만 달라도 한 다리가 살짝 뜨고, 그 다리는 힘을 거의 받지 않습니다. 즉 네 다리가 힘을 어떻게 나눠 받는지는 평형만으로는 알 수 없고, 다리 길이나 바닥이 얼마나 눌리는지, 다시 말해 변형을 알아야 정해져요. 의자가 정정 구조물, 탁자가 부정정 구조물이라고 생각하면 됩니다.',
      board: {
        title: '② 비유 :  의자 vs 탁자',
        points: [
          '• 다리 3개 의자  →  정정',
          '• 다리 4개 탁자  →  부정정',
          { text: '힘의 분배 = 변형이 결정', color: 'blue' },
        ],
        diagram: 'table-analogy',
      },
    },
    // ③ 정확한 정의
    {
      say: '이제 정확하게 정의해 볼게요. 평면 구조물에서 쓸 수 있는 평형방정식은 수평 방향 힘의 합, 수직 방향 힘의 합, 모멘트의 합이 0이라는 세 개뿐입니다. 그런데 구해야 할 반력이나 부재력, 즉 미지수가 이 식의 개수보다 많으면 평형방정식만으로는 답을 정할 수 없어요. 이런 구조물을 부정정 구조물이라고 합니다. 그리고 미지수가 식보다 몇 개 더 많은지를 부정정 차수라고 해요. 칠판 그림에서 위의 단순보는 미지수 3개, 식 3개라서 정정이고, 아래처럼 한쪽을 고정단으로 바꾸면 미지수가 4개가 되어 1차 부정정이 됩니다.',
      board: {
        title: '③ 정의',
        points: [
          '• 평형방정식 :  ΣH = 0,  ΣV = 0,  ΣM = 0',
          '• 미지수(반력·부재력)  >  식의 수',
          { text: '→ 부정정 구조물', color: 'red', box: true },
          '• 부정정 차수  N = 미지수 − 식의 수',
        ],
        diagram: 'statics-compare',
      },
    },
    // ④ 예시 (주변 구조물)
    {
      say: '부정정 구조물은 생각보다 훨씬 흔해요. 강을 건너는 다리를 보면 상판이 여러 교각 위에 쭉 이어져 있죠. 이런 걸 연속보라고 하는데, 칠판 위쪽 그림처럼 지점이 세 개면 반력이 네 개라서 1차 부정정입니다. 아래쪽처럼 양 끝을 모두 벽에 고정한 보는 반력이 여섯 개라서 3차 부정정이고요. 그리고 여러분이 지금 앉아 있는 이 건물도 기둥과 보가 단단하게 붙어 있는 라멘 구조라서, 대부분 차수가 높은 부정정 구조물입니다.',
      board: {
        title: '④ 예시 :  주변의 부정정 구조물',
        points: [
          '• 연속보  →  교량 상판',
          '• 양단 고정보',
          '• 라멘  →  건물의 기둥 + 보',
        ],
        diagram: 'examples',
      },
    },
    // ④ 예시 (간단한 보)
    {
      say: '간단한 예를 하나 직접 볼까요? A는 고정단, B는 롤러인 보에 등분포하중이 걸려 있습니다. 고정단 반력 세 개, 롤러 반력 하나, 합쳐서 네 개니까 1차 부정정이에요. 식이 하나 모자라죠. 그 모자란 식은 어디서 가져올까요? B점은 롤러로 받쳐져 있으니까 위아래로 움직일 수 없다, 즉 B점의 처짐이 0이라는 변형 조건에서 가져옵니다. 이 조건을 쓰면 R B는 8분의 3 w L, R A는 8분의 5 w L로 구해져요. 자세한 계산은 다음 시간에 변형일치법으로 함께 해 봅시다.',
      board: {
        title: '④ 예시 :  한쪽 고정, 한쪽 롤러',
        points: [
          '• r = 3 + 1 = 4  →  1차 부정정',
          '• 모자란 식 :  B점 처짐 = 0',
          { text: 'R_B = 3wL/8 ,   R_A = 5wL/8', color: 'red' },
        ],
        diagram: 'propped-beam',
      },
    },
    // ⑤ 자주 하는 실수
    {
      say: '처음 배울 때 자주 하는 실수 세 가지를 짚고 갈게요. 첫째, 지점 개수와 반력 개수를 헷갈리는 겁니다. 고정단은 수평, 수직, 모멘트까지 반력이 세 개, 힌지는 두 개, 롤러는 한 개예요. 지점이 두 개라고 반력이 두 개인 게 아닙니다. 둘째, 부정정이라는 말을 불안정하다는 뜻으로 오해하는 경우가 많은데, 오히려 반대예요. 차수가 0보다 작으면 받쳐 주는 게 부족해서 무너지는 불안정 구조물이고, 0이면 정정, 0보다 크면 여유가 있는 부정정 구조물입니다. 셋째, 식이 모자랄 때 평형방정식을 이리저리 더 세우면 풀릴 거라고 생각하는 건데요, 새로 세운 식은 결국 앞의 세 식을 조합한 것이라 새로운 정보가 없어요. 반드시 변형 조건이 필요합니다.',
      board: {
        title: '⑤ 자주 하는 실수',
        points: [
          '• 지점 개수 ≠ 반력 개수',
          '    고정단 3 · 힌지 2 · 롤러 1',
          '• 부정정 ≠ 불안정',
          { text: '• 평형식을 더 세워도 안 풀림', color: 'red' },
        ],
        diagram: 'determinacy-scale',
      },
    },
    // ⑥ 한 줄 요약
    {
      say: '오늘 내용을 한 줄로 요약하면, 부정정 구조물은 평형방정식만으로는 부족해서 변형 조건까지 함께 써야 풀 수 있는 구조물입니다. 더 튼튼하고 덜 처지게 하려고 일부러 받침을 더 둔 구조물이고, 몇 차 부정정인지는 미지수 개수에서 식의 개수를 빼서 구해요. 다음 시간에는 이 모자란 식을 변형 조건으로 채우는 대표적인 방법, 변형일치법을 배우겠습니다.',
      board: {
        title: '⑥ 한 줄 요약',
        points: [
          { text: '부정정 구조물  =  평형방정식 + 변형 조건으로 푸는 구조물', color: 'red', box: true },
          '• 왜?  →  더 튼튼하고 덜 처지게',
          '• 몇 차?  →  N = 미지수 − 식의 수',
          { text: '※ 다음 시간 :  변형일치법', color: 'blue' },
        ],
        diagram: null,
      },
    },
    // 마무리 (칠판은 그대로)
    {
      say: '혹시 의자와 탁자 비유에서 이해가 안 되는 부분이나 궁금한 점 있으면 지금 질문해 주세요. 없으면 오늘은 여기까지 하겠습니다. 수고했어요!',
      board: null,
    },
  ],
};
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --hud-bg:rgba(22,26,32,.62);
    --hud-fg:#f3f5f8;
    --hud-sub:#c3cad3;
    --accent:#3f7fe0;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:#1a1d22;font-family:'Noto Sans KR',system-ui,sans-serif}
  canvas{display:block;cursor:grab;touch-action:none}
  canvas.drag{cursor:grabbing}
  .panel{background:var(--hud-bg);color:var(--hud-fg);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:12px;border:1px solid rgba(255,255,255,.12)}
  #info{position:fixed;top:16px;left:16px;padding:12px 16px;max-width:290px;font-size:13px;line-height:1.6}
  #info h1{margin:0 0 4px;font-size:15px;font-weight:700}
  #info p{margin:0;color:var(--hud-sub)}
  #info kbd{background:rgba(255,255,255,.14);border-radius:4px;padding:0 5px;font-family:inherit;font-size:12px;color:var(--hud-fg)}
  #info .toggle{margin-top:6px;font-size:12px;color:var(--hud-sub);cursor:pointer;user-select:none}
  #info.min p{display:none}
  #compass{position:fixed;top:16px;right:16px;padding:10px 14px;font-size:13px;text-align:center;min-width:90px}
  #compass b{display:block;font-size:16px}
  #compass span{color:var(--hud-sub);font-size:12px}
  #views{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:6px;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 32px);box-sizing:border-box}
  #views button{background:transparent;color:var(--hud-fg);border:0;border-radius:8px;padding:8px 13px;font:inherit;font-size:13px;cursor:pointer}
  #views button:hover{background:rgba(255,255,255,.12)}
  #views button.on{background:var(--accent)}
  #teacher{position:fixed;top:calc(92px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));padding:10px 12px;font-size:12px;width:150px;box-sizing:border-box}
  #teacher .t-head{font-weight:700;font-size:13px}
  #teacher .t-status{color:var(--hud-sub);margin:2px 0 8px;min-height:1.4em}
  #teacher .t-btns{display:grid;grid-template-columns:1fr 1fr;gap:4px}
  #teacher button{background:rgba(255,255,255,.08);color:var(--hud-fg);border:0;border-radius:6px;padding:6px 4px;font:inherit;cursor:pointer}
  #teacher button:hover{background:rgba(255,255,255,.18)}
  #teacher button.on{background:var(--accent)}
  #teacher label{display:flex;align-items:center;gap:6px;margin-top:8px;color:var(--hud-sub);cursor:pointer}
  #lecture{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom,0px));width:min(780px,calc(100vw - 32px));box-sizing:border-box;padding:12px 16px;display:grid;gap:6px}
  #lecture .lec-top{display:flex;align-items:center;gap:8px;font-size:12px;min-width:0}
  #lecture .lec-who{background:var(--accent);border-radius:999px;padding:2px 10px;font-weight:700;flex:none}
  #lecture .lec-step{color:var(--hud-sub);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #lecture .lec-mini{flex:none;background:rgba(255,255,255,.1);color:var(--hud-fg);border:0;border-radius:6px;padding:4px 9px;font:inherit;font-size:12px;cursor:pointer}
  #lecture .lec-mini[aria-pressed="true"]{background:var(--accent)}
  #lecture .lec-text{margin:0;font-size:17px;line-height:1.6;min-height:3.2em;text-wrap:pretty}
  #lecture .lec-nav{display:flex;gap:8px;justify-content:flex-end}
  #lecture .lec-nav button{background:rgba(255,255,255,.1);color:var(--hud-fg);border:0;border-radius:8px;padding:8px 16px;font:inherit;font-size:14px;cursor:pointer}
  #lecture .lec-nav button.primary{background:var(--accent);font-weight:700}
  #lecture .lec-nav button:hover:not(:disabled){filter:brightness(1.15)}
  #lecture button:disabled{opacity:.35;cursor:default}
  @media (max-width:600px){#lecture .lec-text{font-size:15px}#lecture{padding:10px 12px}}
  button:focus-visible,#teacher input:focus-visible{outline:2px solid #9cc2ff;outline-offset:2px}
  @media (max-width:600px){
    #info{max-width:calc(100vw - 150px);font-size:12px;padding:10px 12px}
    #views button{padding:7px 9px;font-size:12px}
  }
</style>
</head>
<body>
<div id="info" class="panel">
  <h1>대학 강의실 · 2열 가운데 자리</h1>
  <p>마우스 드래그(또는 터치)로 고개 돌리기<br>
  <kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> / <kbd>A</kbd><kbd>D</kbd><kbd>W</kbd><kbd>S</kbd> 회전 · 휠로 확대<br>
  <kbd>Space</kbd> 일어서기/앉기 · <kbd>R</kbd> 정면으로</p>
  <div class="toggle" id="infoToggle">도움말 접기</div>
</div>
<div id="compass" class="panel"><b id="dirName">정면</b><span id="dirDeg">0°</span></div>
<div id="teacher" class="panel">
  <div class="t-head">교수님</div>
  <div class="t-status" id="tStatus">아바타 불러오는 중…</div>
  <div class="t-btns">
    <button data-anim="Idle">대기</button>
    <button data-anim="Talking">설명</button>
    <button data-anim="Waving">손 흔들기</button>

<script>
(() => {
'use strict';

}
// 모서리가 둥근 판재 (바닥 y=0 ~ 위 y=h)
function roundedSlab(w, d, h, r, bevel) {
  const g = new THREE.ExtrudeGeometry(roundedRectShape(w - 2*bevel, d - 2*bevel, r), {

}

const floorTex = canvasTex(1024, 1024, (g, w, h) => {

}, [W/1.2, D/1.2]);

const meshBackTex = canvasTex(128, 128, (g, w, h) => {

const panelTex = canvasTex(256, 128, (g, w, h) => {

const blindTex = canvasTex(256, 512, (g, w, h) => {

const backWallTex = canvasTex(512, 1024, (g, w, h) => {

/* 화이트보드 판서 */
function drawArrow(g, x1, y1, x2, y2, s = 14) {
  g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
  const a = Math.atan2(y2 - y1, x2 - x1);
  g.beginPath(); g.moveTo(x2, y2); g.lineTo(x2 - s*Math.cos(a - .45), y2 - s*Math.sin(a - .45));
  g.moveTo(x2, y2); g.lineTo(x2 - s*Math.cos(a + .45), y2 - s*Math.sin(a + .45)); g.stroke();
}
const INK = { black: '#1b1d21', blue: '#1d4fb8', red: '#c62828', green: '#1f7a3a' };
const BOARD_W = 2560, BOARD_H = 667;               // 화이트보드 4.8m x 1.25m 비율
const boardState = { content: (window.LECTURE && LECTURE.cover) || null, reveal: 1, revealing: false };
const REVEAL_SECS = 1.6;

function bLine(g, x1, y1, x2, y2) { g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); }
function bText(g, s, x, y, color, size, align = 'left') { g.fillStyle = color; g.font = `${size}px ${HAND}`; g.textAlign = align; g.fillText(s, x, y); g.textAlign = 'left'; }
function bFixed(g, x, y, k, dir = 1) {
  g.strokeStyle = INK.black; g.lineWidth = 5*k; bLine(g, x, y - 70*k, x, y + 70*k);

function bRoller(g, x, y, k) {
  g.strokeStyle = INK.black; g.lineWidth = 4*k;
  g.beginPath(); g.moveTo(x, y + 4*k); g.lineTo(x - 26*k, y + 46*k); g.lineTo(x + 26*k, y + 46*k); g.closePath(); g.stroke();

}

function drawDiagram(g, d, x, y, w, h) {
  try {
    if (typeof d === 'function') d(g, x, y, w, h);
    else if (DIAGRAMS[d]) DIAGRAMS[d](g, x, y, w, h);
    else if (d) bText(g, `(그림 "${d}" 없음)`, x + w/2, y + h/2, INK.red, 48, 'center');
  } catch (err) { console.error('[lecture] 그림 그리기 오류:', d, err); }
}

function wrapLines(g, text, maxW) {
  const out = []; let line = '';
  for (const ch of text) {
    const test = line + ch;
    if (g.measureText(test).width > maxW && line) { const sp = line.lastIndexOf(' '); if (sp > line.length*0.5) { out.push(line.slice(0, sp)); line = line.slice(sp + 1) + ch; } else { out.push(line); line = ch; } }
    else line = test;
  }
  if (line) out.push(line);
  return out;
}

function drawBoard(g, w, h, c, reveal = 1) {
  let sd = 4242; const r = () => (sd = sd*16807 % 2147483647) / 2147483647;
  g.fillStyle = '#fbfcfc'; g.fillRect(0, 0, w, h);
  const glare = g.createLinearGradient(0, 0, w, h);
  glare.addColorStop(0, 'rgba(225,230,235,.5)'); glare.addColorStop(.45, 'rgba(255,255,255,0)'); glare.addColorStop(1, 'rgba(220,225,230,.45)');
  g.fillStyle = glare; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 6; i++) { g.fillStyle = `rgba(150,160,175,${.03 + r()*.04})`; g.beginPath(); g.ellipse(r()*w, r()*h, 120 + r()*160, 30 + r()*40, r(), 0, Math.PI*2); g.fill(); }
  if (!c) return;
  g.lineCap = 'round'; g.lineJoin = 'round';
  const pts = c.points || [], hasD = !!c.diagram;
  const items = 1 + pts.length + (hasD ? 1 : 0);
  const shown = reveal*items, vis = i => Math.max(0, Math.min(1, shown - i));

  g.globalAlpha = vis(0);
  bText(g, c.title || '', 70, 105, INK.blue, 86);
  g.font = `86px ${HAND}`;
  g.strokeStyle = INK.blue; g.lineWidth = 4; bLine(g, 70, 124, 70 + Math.min(w - 140, g.measureText(c.title || '').width + 30), 128);

  const colW = hasD ? 1290 : w - 160;
  // 줄이 넘치면 글자 크기를 줄임
  let size = 60, layout;
  for (; size >= 38; size -= 4) {
    g.font = `${size}px ${HAND}`;
    layout = pts.map(p => { const o = typeof p === 'string' ? { text: p } : p; return { o, lines: wrapLines(g, o.text || '', colW) }; });
    const total = layout.reduce((s, it) => s + it.lines.length, 0)*size*1.32 + pts.length*8;
    if (205 + total < h - 20) break;
  }
  let y = 205, idx = 1;
  layout.forEach(({ o, lines }) => {
    g.globalAlpha = vis(idx++);
    const y0 = y;
    lines.forEach(l => { bText(g, l, 75, y, INK[o.color] || INK.black, size); y += size*1.32; });
    if (o.box) {
      g.font = `${size}px ${HAND}`;
      const bw = Math.max(...lines.map(l => g.measureText(l).width));
      g.strokeStyle = INK[o.color] || INK.black; g.lineWidth = 4; g.strokeRect(55, y0 - size*0.95, bw + 45, y - y0 + size*0.05);
    }
    y += 8;
  });
  if (hasD) { g.globalAlpha = vis(idx); drawDiagram(g, c.diagram, 1430, 165, 1060, 470); }
  g.globalAlpha = 1;
}

function buildTeacher(gltf) {
  const clips = gltf.animations;
  console.log('[teacher.glb] 애니메이션 ' + clips.length + '개:', clips.map(c => c.name));
  clips.forEach((c, i) => console.log(`  ${i + 1}. ${c.name}  (${c.duration.toFixed(2)}초)`));

  const model = gltf.scene;
  model.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false; } });
  model.updateMatrixWorld(true);

  let skinned = null; model.traverse(o => { if (o.isSkinnedMesh && !skinned) skinned = o; });
  const bones = skinned ? skinned.skeleton.bones : [];
  const bone = n => model.getObjectByName('mixamorig' + n) || model.getObjectByName('mixamorig:' + n) || model.getObjectByName(n);
  const rest = bones.map(b => b.quaternion.clone());

  // 아바타의 앞/왼쪽 방향을 발 → 발끝 방향으로 계산
  const UPV = new THREE.Vector3(0, 1, 0);
  let F = new THREE.Vector3(0, 0, 1);
  const foot = bone('LeftFoot'), toe = bone('LeftToeBase');
  if (foot && toe) { const d = toe.getWorldPosition(new THREE.Vector3()).sub(foot.getWorldPosition(new THREE.Vector3())); d.y = 0; if (d.lengthSq() > 1e-8) F = d.normalize(); }
  const L = new THREE.Vector3().crossVectors(UPV, F).normalize();
  const dir = (l, u, f) => new THREE.Vector3().addScaledVector(L, l).addScaledVector(UPV, u).addScaledVector(F, f).normalize();

  // ---- 절차적 포즈 도구 (GLB에 없는 동작을 만들 때 사용) ----
  const resetRest = () => { bones.forEach((b, i) => b.quaternion.copy(rest[i])); model.updateMatrixWorld(true); };
  const worldDelta = (b, delta) => {
    const wq = b.getWorldQuaternion(new THREE.Quaternion());
    const pq = b.parent.getWorldQuaternion(new THREE.Quaternion()).invert();
    b.quaternion.copy(pq.multiply(delta.multiply(wq)));
    model.updateMatrixWorld(true);
  };
  const aim = (name, childName, d) => {
    const b = bone(name), c = bone(childName); if (!b || !c) return;
    const cur = c.getWorldPosition(new THREE.Vector3()).sub(b.getWorldPosition(new THREE.Vector3())).normalize();
    worldDelta(b, new THREE.Quaternion().setFromUnitVectors(cur, d));
  };
  const turn = (name, axis, ang) => { const b = bone(name); if (b) worldDelta(b, new THREE.Quaternion().setFromAxisAngle(axis, ang)); };
  const pose = fn => { resetRest(); fn(); return bones.map(b => b.quaternion.clone()); };
  const clipFrom = (name, times, poses) => new THREE.AnimationClip(name, times[times.length - 1], bones.map((b, i) => {
    const v = []; poses.forEach(p => v.push(p[i].x, p[i].y, p[i].z, p[i].w));
    return new THREE.QuaternionKeyframeTrack(b.name + '.quaternion', times, v);
  }));

  const leftDown = (s = 0) => {
    aim('LeftArm', 'LeftForeArm', dir(0.2 + s, -1, 0.03));
    aim('LeftForeArm', 'LeftHand', dir(0.1, -1, 0.25 + s));
    aim('LeftHand', 'LeftHandMiddle1', dir(0.06, -1, 0.15));
  };
  const rightDown = (s = 0) => {
    aim('RightArm', 'RightForeArm', dir(-0.2 - s, -1, 0.03));
    aim('RightForeArm', 'RightHand', dir(-0.1, -1, 0.25 + s));
    aim('RightHand', 'RightHandMiddle1', dir(-0.06, -1, 0.15));
  };
  const base = (breath = 0, head = 0, sway = 0) => {
    turn('Hips', F, sway);
    turn('Spine2', L, -breath);
    turn('Neck', UPV, head);
    leftDown(breath * 0.6); rightDown(breath * 0.6);
  };

  const generated = {
    Idle: () => {   // 숨쉬기 + 가벼운 체중 이동 + 고개를 좌우로 둘러봄
      const p0 = pose(() => base(0, 0, 0)), p1 = pose(() => base(0.03, 0.12, 0.015)), p2 = pose(() => base(0, 0.02, 0)), p3 = pose(() => base(0.03, -0.12, -0.015));
      return clipFrom('Idle (자동 생성)', [0, 2, 4, 6, 8], [p0, p1, p2, p3, p0]);
    },
    Talking: () => {
      const g = (a, b2, h) => pose(() => { base(0.02, h, 0);
        aim('RightArm', 'RightForeArm', dir(-0.35, -0.8, 0.35)); aim('RightForeArm', 'RightHand', dir(-0.2 - a, 0.1, 1));
        aim('LeftArm', 'LeftForeArm', dir(0.35, -0.8, 0.35)); aim('LeftForeArm', 'LeftHand', dir(0.2 + b2, 0.1, 1)); });
      const p0 = pose(() => base());
      return clipFrom('Talking (자동 생성)', [0, .6, 1.3, 2, 2.7, 3.4], [p0, g(.2, 0, .1), g(-.1, .3, -.05), g(.3, .1, .08), g(0, .25, -.1), p0]);
    },
    Waving: () => {  // 오른팔을 들고 손을 좌우로 흔듦
      const w = side => pose(() => { base(0.02, -0.05, 0); leftDown();
        aim('RightArm', 'RightForeArm', dir(-0.8, 0.45, 0.3));
        aim('RightForeArm', 'RightHand', dir(-0.15 + side, 1, 0.15));
        aim('RightHand', 'RightHandMiddle1', dir(-0.1 + side, 1, 0.1)); });
      const p0 = pose(() => base());
      return clipFrom('Waving (자동 생성)', [0, .5, .85, 1.2, 1.55, 1.9, 2.25, 2.9], [p0, w(-.35), w(.35), w(-.35), w(.35), w(-.35), w(.2), p0]);
    },
    Pointing: () => {  // 몸과 고개를 스크린 쪽으로 돌리고 오른팔로 가리킴
      const pt = pose(() => { base(0.02, 0, 0); turn('Spine1', UPV, -0.28); turn('Neck', UPV, -0.55); leftDown();
        aim('RightArm', 'RightForeArm', dir(-1, 0.32, -0.3));
        aim('RightForeArm', 'RightHand', dir(-1, 0.34, -0.32));
        aim('RightHand', 'RightHandMiddle1', dir(-1, 0.34, -0.32)); });
      const p0 = pose(() => base());
      return clipFrom('Pointing (자동 생성)', [0, .7, 3.0, 3.8], [p0, pt, pt, p0]);
    },
  };

  // ---- 이름으로 클립 찾기 (정확한 이름 → 비슷한 이름 → 없으면 자동 생성) ----
  const findClip = key => {
    const lower = clips.map(c => c.name.toLowerCase());
    let i = lower.indexOf(key.toLowerCase());
    if (i < 0) i = lower.findIndex(n => ANIM_ALIASES[key].some(a => n.includes(a)));
    return i >= 0 ? clips[i] : null;
  };
  const chosen = {};
  ANIM_KEYS.forEach(key => {
    const found = findClip(key);
    if (found) {
      const c = found.clone();
      // 제자리에서 움직이도록 엉덩이의 수평 이동 고정
      c.tracks.forEach(t => { if (/Hips\.position$/.test(t.name)) for (let k = 0; k < t.values.length; k += 3) { t.values[k] = t.values[0]; t.values[k + 2] = t.values[2]; } });
      chosen[key] = c;
      console.log(`[teacher] ${key} → GLB 클립 "${found.name}" 사용`);
    } else {
      chosen[key] = generated[key]();
      console.log(`[teacher] ${key} → GLB에 없음, 비슷한 모션을 자동 생성`);
    }
  });
  resetRest();

  // ---- 크기 · 위치 · 방향 ----
  const box = new THREE.Box3().setFromObject(model);
  const h = box.max.y - box.min.y;
  const scale = h > 0 ? TEACHER_HEIGHT / h : 1;
  const holder = new THREE.Group();
  model.scale.setScalar(scale);
  model.position.y = -box.min.y * scale;
  holder.add(model);
  holder.position.copy(TEACHER_POS);
  // 아바타 정면(F)을 학생 쪽(+z)으로, 살짝 강의실 가운데를 향하게
  holder.rotation.y = -Math.atan2(F.x, F.z) - 0.25;
  scene.add(holder);
  console.log(`[teacher] 원래 높이 ${h.toFixed(3)} → 배율 ${scale.toFixed(3)} (키 ${TEACHER_HEIGHT}m)`);

  const mixer = new THREE.AnimationMixer(model);
  ANIM_KEYS.forEach(k => { teacher.actions[k] = mixer.clipAction(chosen[k]); });
  mixer.addEventListener('finished', e => { if (e.action === teacher.current) { if (teacher.auto) nextAuto(); else playAnim('Idle'); } });
  Object.assign(teacher, { model: holder, mixer });

  if (typeof lec !== 'undefined' && lec.i >= 0) {   // 아바타가 늦게 불러와졌는데 강의가 이미 진행 중이면 그 상태에 맞춤
    playAnim(lec.phase === 'point' ? 'Pointing' : lec.phase === 'talk' ? 'Talking' : 'Idle', lec.phase === 'point');
    teacher.waitFinish = true;
  } else {
    playAnim('Waving', true);        // 처음엔 학생들에게 인사
    teacher.waitFinish = true; teacher.step = -1;
  }
}

function playAnim(key, once) {
  const a = teacher.actions[key]; if (!a) return;
  once = once !== undefined ? once : (key === 'Waving' || key === 'Pointing');
  if (teacher.current === a && !once) return;
  a.reset();
  a.setLoop(once ? THREE.LoopOnce : THREE.LoopRepeat, Infinity);
  a.clampWhenFinished = true;
  a.setEffectiveWeight(1).setEffectiveTimeScale(1);
  a.play();
  if (teacher.current && teacher.current !== a) a.crossFadeFrom(teacher.current, 0.45, false);
  teacher.current = a; teacher.key = key;
  tStatus.textContent = ANIM_LABEL[key];
  tButtons.forEach(b => b.classList.toggle('on', b.dataset.anim === key));
}
function nextAuto() {
  teacher.step = (teacher.step + 1) % AUTO_PLAN.length;
  const [key, secs] = AUTO_PLAN[teacher.step];
  teacher.timer = secs; teacher.waitFinish = secs === 0;
  playAnim(key, secs === 0);
}
function updateTeacher(dt) {
  if (!teacher.mixer) return;
  teacher.mixer.update(dt);
  if (teacher.auto && !teacher.waitFinish) { teacher.timer -= dt; if (teacher.timer <= 0) nextAuto(); }
}
tButtons.forEach(b => b.addEventListener('click', () => {
  if (!teacher.mixer) return;
  const k = b.dataset.anim, once = k === 'Waving' || k === 'Pointing';
  playAnim(k, once);
  teacher.waitFinish = once; teacher.timer = 8;   // 수동 재생 후 잠시 뒤 자동 강의가 이어짐
}));
tAuto.addEventListener('change', () => {
  teacher.auto = tAuto.checked;
  if (teacher.auto && !teacher.waitFinish) teacher.timer = 2;
  if (!teacher.auto && teacher.key !== 'Waving' && teacher.key !== 'Pointing') playAnim('Idle');
});

// 클릭: 교수님 → 손 흔들기, 화이트보드/스크린 → 가리키기
const raycaster = new THREE.Raycaster();
function onSceneClick(e) {
  if (!teacher.mixer) return;
  const r = canvas.getBoundingClientRect();
  raycaster.setFromCamera({ x: (e.clientX - r.left) / r.width * 2 - 1, y: -(e.clientY - r.top) / r.height * 2 + 1 }, camera);
  const tHit = raycaster.intersectObject(teacher.model, true)[0];
  const bHit = raycaster.intersectObjects([clickTargets.board, clickTargets.screen], false)[0];
  if (tHit && (!bHit || tHit.distance < bHit.distance + 0.3)) { playAnim('Waving', true); teacher.waitFinish = true; }
  else if (bHit) { playAnim('Pointing', true); teacher.waitFinish = true; }
}

if (THREE.GLTFLoader) {
  new THREE.GLTFLoader().load(TEACHER_URL, gltf => {
    buildTeacher(gltf);
    const q = new URLSearchParams(location.search);
    if (q.has('anim') && teacher.actions[q.get('anim')]) {
      teacher.auto = tAuto.checked = false;
      const k = q.get('anim'); playAnim(k, false);
      if (q.has('t')) { teacher.mixer.stopAllAction(); const a = teacher.actions[k]; a.reset().play(); a.time = +q.get('t'); teacher.mixer.update(0); }
    }
  }, xhr => { if (xhr.total) tStatus.textContent = `아바타 불러오는 중 ${Math.round(xhr.loaded / xhr.total * 100)}%`; },
  err => {
    console.error('[teacher.glb] 불러오기 실패:', err);
    tStatus.textContent = location.protocol === 'file:' ? '파일로 직접 열면 아바타를 불러올 수 없어요. 웹 링크로 열어 주세요.' : '아바타를 불러오지 못했습니다.';
  });
} else { tStatus.textContent = '3D 로더를 불러오지 못했습니다.'; }

/* ---------- 강의 진행 ---------- */
const CHARS_PER_SEC = 9;          // 자막이 나오는 속도 (글자/초)
const POINT_TO_BOARD = 0.6;       // 가리키기 시작 후 칠판에 글이 나타나기까지 (초)
const POINT_TO_TALK = 1.9;        // 가리키기 시작 후 말하기 시작까지 (초)
const lec = { i: -1, phase: 'ready', timer: 0, text: '', shown: -1, chars: 0, ttsOn: false, ttsDone: true, hold: 0, savedAuto: true };
const lecText = document.getElementById('lecText'), lecStep = document.getElementById('lecStep');
const lecPrev = document.getElementById('lecPrev'), lecNext = document.getElementById('lecNext'), ttsBtn = document.getElementById('ttsBtn');
const lecWrap = document.getElementById('lecture');

function boardFor(i) { for (let k = i; k >= 0; k--) if (LECTURE.steps[k].board) return LECTURE.steps[k].board; return LECTURE.cover; }
function teacherDo(key) { if (!teacher.mixer) return; playAnim(key, key === 'Pointing' || key === 'Waving'); teacher.waitFinish = true; }

function setSubtitle(s) { lecText.textContent = s; }
function updateLecUI() {
  const n = LECTURE.steps.length;
  if (lec.i < 0) { lecStep.textContent = '강의 전'; lecPrev.disabled = true; lecNext.textContent = '강의 시작 ▶'; return; }
  const b = boardFor(lec.i);
  lecStep.textContent = `${lec.i + 1} / ${n} · ${b ? b.title.replace(/\s+/g, ' ') : ''}`;
  lecPrev.disabled = lec.i === 0;
  lecNext.textContent = lec.i === n - 1 ? '강의 마치기 ■' : '다음 ▶';
}

function startLecture() {
  lec.savedAuto = teacher.auto; teacher.auto = false; tAuto.checked = false;
  screenAnim.target = 0;                    // 화이트보드가 보이게 스크린을 말아 올림
  tAuto.disabled = true;
  lecWrap.classList.add('on');
}
function endLecture() {
  stopSpeech();
  lec.i = -1; lec.phase = 'ready';
  screenAnim.target = 1; tAuto.disabled = false;
  showOnBoard(LECTURE.cover, false);
  teacherDo('Waving');
  teacher.auto = lec.savedAuto; tAuto.checked = lec.savedAuto; teacher.step = -1;
  setSubtitle(`강의가 끝났습니다. ‘강의 시작’을 누르면 처음부터 다시 듣습니다.`);
  lecWrap.classList.remove('on');
  updateLecUI();
}

function goStep(i) {
  const n = LECTURE.steps.length;
  if (i >= n) { endLecture(); return; }
  i = Math.max(0, i);
  if (lec.i < 0) startLecture();
  stopSpeech();
  const prevBoard = lec.i >= 0 ? boardFor(lec.i) : boardState.content;
  lec.i = i;
  const st = LECTURE.steps[i];
  lec.text = st.say || ''; lec.chars = 0; lec.shown = -1; setSubtitle('');
  const nb = boardFor(i);
  if (nb && nb !== prevBoard) {           // 새 칠판 내용 → 먼저 칠판을 가리키고, 글을 띄운 뒤 설명
    lec.phase = 'point'; lec.timer = 0; lec.boardShown = false; lec.nextBoard = nb;
    teacherDo('Pointing');
  } else beginTalk();
  updateLecUI();
}
function beginTalk() {
  lec.phase = 'talk'; lec.hold = 0;
  teacherDo('Talking');
  lec.ttsDone = !lec.ttsOn;
  if (lec.ttsOn) speak(lec.text);
}
function updateLecture(dt) {
  if (lec.phase === 'point') {
    lec.timer += dt;
    if (!lec.boardShown && lec.timer >= POINT_TO_BOARD) { lec.boardShown = true; showOnBoard(lec.nextBoard, true); }
    if (lec.timer >= POINT_TO_TALK) beginTalk();
  } else if (lec.phase === 'talk') {
    lec.chars = Math.min(lec.text.length, lec.chars + dt*CHARS_PER_SEC);
    const c = Math.floor(lec.chars);
    if (c !== lec.shown) { lec.shown = c; setSubtitle(lec.text.slice(0, c)); }
    if (c >= lec.text.length && lec.ttsDone) { lec.hold += dt; if (lec.hold > 0.8) { lec.phase = 'done'; teacherDo('Idle'); } }
  }
}

// 음성 (브라우저 TTS, 한국어 목소리가 있으면 사용)
const synth = window.speechSynthesis;
function speak(text) {
  if (!synth) { lec.ttsDone = true; return; }
  const u = new SpeechSynthesisUtterance(text.replace(/R B/g, '알 비').replace(/R A/g, '알 에이'));
  u.lang = 'ko-KR'; u.rate = 1.05;
  const v = synth.getVoices().find(v => /^ko/i.test(v.lang)); if (v) u.voice = v;
  u.onend = u.onerror = () => { if (lec.utter === u) lec.ttsDone = true; };
  lec.utter = u; synth.speak(u);
  setTimeout(() => { if (lec.utter === u) lec.ttsDone = true; }, (text.length/3 + 5)*1000);   // 안전장치
}
function stopSpeech() { lec.utter = null; if (synth) synth.cancel(); lec.ttsDone = true; }
if (!synth) ttsBtn.hidden = true;
ttsBtn.addEventListener('click', () => {
  lec.ttsOn = !lec.ttsOn;
  ttsBtn.textContent = lec.ttsOn ? '음성 켬' : '음성 끔';
  ttsBtn.setAttribute('aria-pressed', lec.ttsOn);
  if (!lec.ttsOn) stopSpeech();
  else if (lec.phase === 'talk') { lec.ttsDone = false; speak(lec.text.slice(Math.floor(lec.chars))); }
});

lecNext.addEventListener('click', () => goStep(lec.i + 1));
lecPrev.addEventListener('click', () => goStep(lec.i - 1));
window.addEventListener('keydown', e => {
  if (e.target && (e.target.tagName === 'INPUT' || (e.target.tagName === 'BUTTON' && e.key === 'Enter'))) return;
  if (e.key === 'PageDown' || e.key === 'Enter' || e.key.toLowerCase() === 'n') { e.preventDefault(); goStep(lec.i + 1); }
  else if (e.key === 'PageUp' || e.key.toLowerCase() === 'p') { e.preventDefault(); if (lec.i > 0) goStep(lec.i - 1); }
});
setSubtitle(`안녕하세요! 오늘은 「${LECTURE.title}」 강의입니다. 아래 ‘강의 시작’을 누르면 시작합니다.`);
updateLecUI();
{ const q = new URLSearchParams(location.search); if (q.has('step')) { goStep(+q.get('step')); for (let k = 0; k < (+q.get('sim') || 0); k++) { updateLecture(0.05); updateBoard(0.05); updateScreen(0.05); } } }

// 스크린 말아 올리기 / 내리기
function updateScreen(dt) {
  const s = screenAnim; if (!s.mesh) return;
  if (Math.abs(s.cur - s.target) < 1e-4) return;
  s.cur += Math.sign(s.target - s.cur)*Math.min(Math.abs(s.target - s.cur), dt*0.6);
  const c = Math.max(0.0001, s.cur);
  s.mesh.scale.y = c; s.mesh.position.y = s.sTop - s.sh*c/2; s.mesh.visible = c > 0.005;
  slideTex.repeat.y = c; slideTex.offset.y = 0;
  s.bar.position.y = s.sTop - s.sh*c - 0.015;
}

/* ---------- 루프 ---------- */
const clockHands = window.__clockHands;
let last = performance.now(), hudTimer = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  const rs = 1.7;
  if (keys.has('arrowleft') || keys.has('a')) view.tyaw += rs*dt;
  if (keys.has('arrowright') || keys.has('d')) view.tyaw -= rs*dt;
  if (keys.has('arrowup') || keys.has('w')) { view.tpitch += rs*0.7*dt; clampPitch(); }
  if (keys.has('arrowdown') || keys.has('s')) { view.tpitch -= rs*0.7*dt; clampPitch(); }
  const f = 1 - Math.exp(-dt*9);
  view.yaw += (view.tyaw - view.yaw)*f;
  view.pitch += (view.tpitch - view.pitch)*f;
  view.fov += (view.tfov - view.fov)*f;
  view.y += (view.ty - view.y)*(1 - Math.exp(-dt*5));
  camera.rotation.set(view.pitch, view.yaw, 0);
  camera.position.y = view.y;
  if (Math.abs(camera.fov - view.fov) > 0.01) { camera.fov = view.fov; camera.updateProjectionMatrix(); }

  const d = new Date(), s = d.getSeconds() + d.getMilliseconds()/1000, m = d.getMinutes() + s/60, h = (d.getHours() % 12) + m/60;
  clockHands.s.rotation.z = -s/60*TAU; clockHands.m.rotation.z = -m/60*TAU; clockHands.h.rotation.z = -h/12*TAU;

  if ((hudTimer += dt) > 0.1) { hudTimer = 0; updateHud(); }
  updateTeacher(dt);
  updateLecture(dt); updateBoard(dt); updateScreen(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
updateHud();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
